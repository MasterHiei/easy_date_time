name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Static & Package Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: ${{ runner.os }}-pub-root-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-root-

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: dart analyze --fatal-infos --fatal-warnings lib test tool

      - name: Validate DartDoc
        run: dart doc --dry-run .

      - name: Publish dry run
        run: dart pub publish --dry-run

  test_coverage:
    name: Test (Stable & Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: ${{ runner.os }}-pub-root-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-root-

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Install coverage and test tools
        run: |
          dart pub global activate coverage 1.15.1
          dart pub global activate junitreport 2.0.2

      - name: Run tests with coverage
        run: dart pub global run coverage:test_with_coverage --out=coverage -- --file-reporter=json:test-results.json

      - name: Run web tests (Chrome)
        run: dart test -p chrome

      - name: Convert test results to JUnit
        run: dart pub global run junitreport:tojunit --input test-results.json --output test-results.xml

      - name: Enforce line coverage >=95%
        run: dart run tool/check_coverage_threshold.dart coverage/lcov.info 95

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results.xml

  test_compatibility:
    name: Test Compatibility (${{ matrix.os }} / ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sdk: "3.10.0"
            resolution: minimum-runtime
            experimental: false
          - os: ubuntu-latest
            sdk: beta
            resolution: current
            experimental: true
          - os: macos-latest
            sdk: stable
            resolution: current
            experimental: false
          - os: windows-latest
            sdk: stable
            resolution: current
            experimental: false
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: ${{ runner.os }}-pub-root-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-root-

      - name: Resolve dependencies
        if: matrix.resolution == 'current'
        run: dart pub get --no-example

      - name: Resolve oldest compatible runtime dependencies
        if: matrix.resolution == 'minimum-runtime'
        run: dart pub downgrade meta timezone --no-example

      - name: Analyze oldest compatible runtime dependencies
        if: matrix.resolution == 'minimum-runtime'
        run: dart analyze --fatal-infos --fatal-warnings lib test tool

      - name: Run tests
        run: dart test

  validate_example:
    name: Validate Example (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        sdk: ["3.10.0", "stable"]
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: ${{ runner.os }}-pub-example-${{ hashFiles('example/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-example-

      - name: Install dependencies
        working-directory: example
        run: dart pub get --enforce-lockfile

      - name: Analyze example
        working-directory: example
        run: dart analyze --fatal-infos

      - name: Run default example
        working-directory: example
        run: dart run main.dart
