name: Dart Beta

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_CACHE: ${{ github.workspace }}/../dart-pub-cache

jobs:
  vm:
    name: VM (Beta)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        id: dart
        with:
          sdk: beta

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PUB_CACHE }}/hosted
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ steps.dart.outputs.dart-version }}-root-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-${{ steps.dart.outputs.dart-version }}-root-

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Run VM tests
        run: dart test
