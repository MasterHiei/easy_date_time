name: easy_date_time
description: An enhanced DateTime implementation with explicit IANA timezone support.
version: 0.12.3
homepage: https://github.com/MasterHiei/easy_date_time
repository: https://github.com/MasterHiei/easy_date_time
issue_tracker: https://github.com/MasterHiei/easy_date_time/issues
documentation: https://github.com/MasterHiei/easy_date_time/blob/main/README.md

topics:
  - datetime
  - timezone
  - calendar
  - formatting
  - utils

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  meta: ">=1.15.0 <2.0.0"
  timezone: ">=0.11.0 <0.12.0"

dev_dependencies:
  # test_core allows a frontend client that predates Dart 3's SDK layout.
  frontend_server_client: ^4.0.0
  lints: ^6.1.0
  test: ^1.31.1
